# Energy GO CI — SLOW-ACCEPTANCE tier (D30).
# Real-install / venv / subprocess §9.5 acceptance tests, selected with `-m "acceptance"`.
# Carries the install toolchain those tests shell out to: uv + CPython 3.11, plus the
# Linux package-lock regen so `npm ci` inside install_app.sh works on the runner.
#
# NOT a required check — CI is an early signal, not the merge gate (CLAUDE.md, D30).
#
# Triggers (dedicated workflow keyed by paths — see D30):
#   - pull_request ONLY when the installer scripts / packaging manifests change;
#   - nightly cron + push:[main] always.
name: ci-slow-acceptance

on:
  pull_request:
    paths:
      - "scripts/**"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-slow-acceptance.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"

jobs:
  slow-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python 3.11 via uv (acceptance-test toolchain)
        # install_app.sh uses `uv venv --python 3.11`; without this step uv cannot
        # locate CPython 3.11 and exits 3 (dependency install failed) before any
        # port-binding logic can run, causing test_acceptance_launch_exit5 to see
        # exit 3 instead of exit 5.
        run: uv python install 3.11

      - name: Regenerate package-lock.json for Linux
        # package-lock.json is committed from macOS and omits @rollup/rollup-linux-x64-gnu.
        # npm ci inside install_app.sh (acceptance test) fails with exit 3 on Linux unless
        # the lock is regenerated here.  This pre-step makes the lock Linux-compatible
        # before the Python acceptance tests copy it from REPO_ROOT into their tmp dirs.
        run: |
          if [ -f package.json ]; then
            rm -f package-lock.json
            npm install --package-lock-only --ignore-scripts
          fi

      - name: Acceptance tests (real install / venv / subprocess §9.5)
        shell: bash
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' | grep -q .; then
            pip install --no-deps -e .
            pip install \
              "pytest>=8.0" "pytest-asyncio>=0.23" "anyio>=4.0" \
              "pyyaml>=6.0" "jsonschema>=4.21"
            # acceptance tests shell out to install_app/run_app; they create their own venvs,
            # so heavy compute/serving deps are NOT needed in this runner's interpreter.
            pytest tests/ -m "acceptance" -q
          else
            echo "No Python tests yet — skipping"
          fi
