name: ci-nightly

# Slow-lane CI — runs tests tagged @pytest.mark.slow (that still fit the 2 GB runner).
# NOT a merge gate; failures notify via the Actions log but do not block PRs.
#
# HONESTY NOTE (verbatim from contracts/meta/ci_lanes.md §2):
#   "wired-but-near-empty until fits-2 GB slow tests actually exist."
#   After the step-2 slow→local migration, the current slow tests are OOM →
#   re-tagged local, so -m "slow and not local" selects ≈0 tests initially.
#   The nightly workflow is the plumbing; coverage grows as genuinely mid-weight
#   tests are written.  Do NOT imply nightly coverage we do not have.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:        # on-demand (criterion G)

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pre-create pip cache dir
        run: mkdir -p ~/.cache/pip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python 3.11 via uv
        run: uv python install 3.11

      - name: Install Python deps
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            pip install --no-deps -e .
            pip install \
              "pytest>=8.0" "pytest-asyncio>=0.23" "anyio>=4.0" \
              "pyyaml>=6.0" "numpy>=1.26" \
              "jsonschema>=4.21" \
              "jax[cpu]>=0.4.25" "flax>=0.8.0" "optax>=0.2.0" "flashbax>=0.1.0"
          else
            pip install pytest jax numpy
          fi

      - name: Slow-lane tests (fits 2 GB; NOT local/OOM)
        # Selector: slow and not local
        #   'slow'  = slower tests that still fit the 2 GB runner
        #   'local' = OOM tests (full-year JAX jit/vmap) — excluded from all CI lanes
        # After the step-2 migration the current @pytest.mark.slow full-year tests
        # become @pytest.mark.local → nightly also excludes them (correct).
        shell: bash
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' | grep -q .; then
            pytest tests/ -q -m "slow and not local"
          else
            echo "No Python tests yet — skipping"
          fi
