name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Convention checks
        run: bash scripts/check_conventions.sh

      # -----------------------------------------------------------------------
      # Detect docs-only changes — in-job path-skip gate (task #10 / D40)
      #
      # IMPORTANT: this uses an in-job conditional, NOT workflow-level
      # paths-ignore.  paths-ignore would skip the whole job, causing the
      # required `checks` context to never report → branch protection blocks
      # every docs-only PR forever.  Instead:
      #   • The `checks` job ALWAYS runs and ALWAYS reports a status.
      #   • Only the heavy steps (Python tests / Frontend tests / etc.) are
      #     gated with  if: steps.path_check.outputs.docs_only != 'true'.
      #   • Convention checks always run — docs/contract PRs must still pass.
      #
      # Allowlist (conservative): docs/**, contracts/**, root-level *.md only.
      # ANY other changed path → full suite.  Push to main → always full suite.
      # -----------------------------------------------------------------------
      - name: Detect docs-only changes
        id: path_check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "→ Push to main: full suite always runs"
            exit 0
          fi
          git fetch origin ${{ github.base_ref }} --depth=1 2>/dev/null || {
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "→ Could not fetch base ref — safe default: full suite runs"
            exit 0
          }
          changed=$(git diff --name-only FETCH_HEAD HEAD 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "→ No file diff detected — safe default: full suite runs"
            exit 0
          fi
          printf "Changed files:\n%s\n" "$changed"
          # Conservative allowlist:
          #   docs/**              — spec, design docs
          #   contracts/**         — contract .md files
          #   <root>/*.md          — LINEAGE.md, REBUILD_SPEC.md, STACK.md, etc.
          # Anything else (src/, tests/, config/, .github/, assets/, scripts/) →
          # non_docs non-empty → full suite.
          non_docs=$(printf '%s\n' "$changed" | \
            grep -vE '^(docs/|contracts/|[^/]+\.md$)' | head -1 || true)
          if [ -z "$non_docs" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "→ Docs-only PR: heavy test steps will be skipped"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "→ Non-docs files changed: full suite runs"
          fi

      # -----------------------------------------------------------------------
      # Setup — always run (fast; cache restore happens here)
      # -----------------------------------------------------------------------

      - name: Pre-create pip cache dir
        # setup-python@v5 cache:'pip' post-step saves ~/.cache/pip back to the
        # Actions cache.  On docs-only PRs the Python-tests step is skipped →
        # pip never runs → the directory is never created → the post-step fails
        # with "Cache folder path is retrieved for pip but doesn't exist on disk"
        # → checks: failure (PR #116 QA fix — qa scratch-PR #124 empirical catch).
        # mkdir -p is idempotent: no-op when the dir already exists (code PRs).
        run: mkdir -p ~/.cache/pip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache pip's HTTP wheel cache keyed on pyproject.toml.
          # Saves ~3-5 min/run re-downloading jax[cpu]/jaxlib/flax/optax/flashbax.
          # Cache is invalidated when pyproject.toml changes (new dep version).
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Cache npm's global package cache (~/.npm) keyed on package-lock.json.
          # npm install still runs but reads wheels from local cache → ~2 min saved.
          cache: 'npm'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # Cache uv's download cache (~/.cache/uv) keyed on pyproject.toml.
          # Makes `uv python install 3.11` and uv-based venv creation near-instant
          # on warm runs (install_app.sh acceptance-test toolchain).
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python 3.11 via uv (acceptance-test toolchain)
        # install_app.sh uses `uv venv --python 3.11`; without this step uv cannot
        # locate CPython 3.11 and exits 3 (dependency install failed) before any
        # port-binding logic can run, causing test_acceptance_launch_exit5 to see
        # exit 3 instead of exit 5.
        run: uv python install 3.11

      # -----------------------------------------------------------------------
      # Heavy steps — skipped for docs-only PRs (see path_check above)
      # -----------------------------------------------------------------------

      - name: Regenerate package-lock.json for Linux
        # package-lock.json is committed from macOS and omits @rollup/rollup-linux-x64-gnu.
        # npm ci inside install_app.sh (acceptance test) fails with exit 3 on Linux unless
        # the lock is regenerated here.  The Frontend-tests step already does this; this
        # pre-step makes the lock Linux-compatible before the Python acceptance tests copy
        # it from REPO_ROOT into their tmp dirs.
        if: steps.path_check.outputs.docs_only != 'true'
        run: |
          if [ -f package.json ]; then
            rm -f package-lock.json
            npm install --package-lock-only --ignore-scripts
          fi

      - name: Telemetry schema validation (golden examples)
        if: steps.path_check.outputs.docs_only != 'true'
        shell: bash
        run: |
          pip install "jsonschema>=4.21"
          # energy_go.telemetry.validate lives under src/ in this repo;
          # PYTHONPATH makes it importable without a heavy jax install.
          PYTHONPATH=src python scripts/validate_telemetry.py --examples

      - name: Python tests
        if: steps.path_check.outputs.docs_only != 'true'
        shell: bash
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' | grep -q .; then
            if [ -f pyproject.toml ]; then
              # --no-deps on the package itself skips sbx-rl (heavy optional training lib);
              # jax[cpu]+jaxlib, serving, and training framework deps are installed explicitly
              # so the training suite (78 tests) and serving suite execute in CI.
              pip install --no-deps -e .
              pip install \
                "pytest>=8.0" "pytest-asyncio>=0.23" "anyio>=4.0" "pytest-xdist>=3.5" \
                "fastapi>=0.110" "httpx>=0.27" "starlette>=0.36" \
                "pyyaml>=6.0" "numpy>=1.26" "websockets>=12" "uvicorn[standard]>=0.29" \
                "jsonschema>=4.21" \
                "jax[cpu]>=0.4.25" "flax>=0.8.0" "optax>=0.2.0" "flashbax>=0.1.0"
            else
              pip install pytest jax numpy
            fi
            # D30: JAX tests that jit/vmap full-year trajectories are marked @pytest.mark.slow
            # and excluded from CI (-m "not slow") to avoid OOM on ubuntu-latest (2 GB RAM
            # runners hit SIGTERM at ~40-60 min when xdist workers each JIT-compile the
            # full 8760-step synthetic year).  The full suite (including slow) runs locally.
            pytest tests/ -q -m "not slow"
          else
            echo "No Python tests yet — skipping"
          fi

      - name: Frontend tests
        if: steps.path_check.outputs.docs_only != 'true'
        shell: bash
        run: |
          if [ -f package.json ] && find tests -name '*.test.ts*' 2>/dev/null | grep -q .; then
            # Delete the macOS-generated lock before install: avoids the known npm/rollup
            # cross-platform optional-dep bug (github.com/npm/cli/issues/4828) where a
            # macOS lock omits @rollup/rollup-linux-x64-gnu even under `npm install`.
            # Rollup's own error message recommends removing both lock + node_modules.
            rm -f package-lock.json
            npm install
            npm test
            # Task #40: production TypeScript typecheck + bundle (tsc + vite build).
            # Catches type errors that Vitest/RTL unit tests don't exercise and confirms
            # the production bundle compiles cleanly on each PR.  Uses the node_modules
            # already installed above — no second install needed.
            npm run build
          else
            echo "No frontend tests yet — skipping"
          fi

      - name: Registry committed-copy drift check
        # Catches stale committed copies: regenerates src/config/registryData.json from
        # the canonical assets/3d/registry.json and fails if they differ.  Guards the
        # partial-checkout fallback path — if the committed copy is out of sync it will
        # be used verbatim by sandboxed builds (serving fixture, etc.) that lack assets/3d/.
        # Contract: contracts/frontend/registry_build_copy.md §3
        if: steps.path_check.outputs.docs_only != 'true'
        shell: bash
        run: |
          if [ -f assets/3d/registry.json ] && [ -f src/config/registryData.json ]; then
            node scripts/copy_registry.js
            git diff --exit-code src/config/registryData.json || \
              (echo "ERROR: src/config/registryData.json is stale — re-run 'node scripts/copy_registry.js' and commit the result" && exit 1)
          else
            echo "Registry drift check skipped (partial checkout or file absent)"
          fi
