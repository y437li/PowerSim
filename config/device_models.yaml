    type: pv_panel
    provenance: "public; LONGi Green Energy Hi-MO X6 product datasheet LR5-72HIH-610M (2024); IRENA Renewable Power Generation Costs 2023 China utility PV; CNESA 2024"
    physics:
      k_T_per_c:        -0.0029  # /°C  — temperature coefficient; LONGi Hi-MO X6: -0.29%/°C
                                  #        n-type TOPCon advantage vs PERC (-0.35%/°C typical)
                                  #        (non-overridable)
      eta_inverter:       0.985   # —    — modern string inverter 2024 (Huawei/Sungrow/SMA)
                                  #        (non-overridable)
      degradation_yr1:    0.98    # —    — year-1 output fraction; LONGi spec 2% yr-1; site-overridable
    economics:
      # CAPEX: LONGi drives China utility PV floor; IRENA 2023 ≈ $420 USD/kW → ¥3000/kW
      capex_per_kw_yuan:               3000.0  # ¥/kW — ≈420 USD/kW; LONGi cost-leader pricing 2024
      opex_fixed_per_kw_year_yuan:       75.0  # ¥/kW·yr — ≈10.5 USD/kW·yr; IRENA 2023 benchmark
      opex_var_per_mwh_yuan:              0.0  # ¥/MWh
      lifetime_years:                    30.0  # yr    — n-type TOPCon rated 30 yr at ≥80% output
      replacement_cost_fraction:          0.10 # —     — inverter mid-life replacement (~year 15)
      residual_value_fraction:            0.02 # —
      construction_months:                9.0  # months
      decommissioning_cost_per_kw_yuan:  50.0  # ¥/kW

