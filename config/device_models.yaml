                                  #        (non-overridable)
      eta_inverter:       0.985   # —    — modern string inverter 2024 (non-overridable)
      degradation_yr1:    0.98    # —    — year-1 output fraction; JA Solar spec; site-overridable
    economics:
      capex_per_kw_yuan:               3100.0  # ¥/kW — ≈430 USD/kW; slightly above LONGi
      opex_fixed_per_kw_year_yuan:       78.0  # ¥/kW·yr — ≈11 USD/kW·yr
      opex_var_per_mwh_yuan:              0.0  # ¥/MWh
      lifetime_years:                    30.0  # yr
      replacement_cost_fraction:          0.10 # —
      residual_value_fraction:            0.02 # —
      construction_months:                9.0  # months
      decommissioning_cost_per_kw_yuan:  52.0  # ¥/kW

  # --------------------------------------------------------
  #  BESS — LFP grid-scale benchmark models (China 2024)
  # --------------------------------------------------------

  byd-mc-cube-lfp:
    # BYD MC Cube — modular LFP container (314 Ah blade battery cells)
    # 2 MWh per 20ft module; 90% DoD; 8000-cycle design life
    type: battery
    provenance: "public; BYD MC Cube product data (2024); CNESA China Energy Storage Market Report 2024; IRENA Utility-Scale Batteries Innovation Outlook 2023"
    physics:
      eta_ch:               0.965  # —   — charge efficiency; BYD system round-trip ~93.1%;
                                    #       split 0.965×0.965=0.931 (non-overridable)
      eta_dis:              0.965  # —   — discharge efficiency (non-overridable)
      soc_min:              0.10   # —   — min SOC; BYD MC Cube 90% DoD → 10-90% (non-overridable)
      soc_max:              0.90   # —   — max SOC (non-overridable)
      capacity_mwh_per_unit: 2.0   # MWh — 20ft container module: 2.0 MWh (BYD public spec)
      power_mw_per_unit:     1.0   # MW  — 0.5C rate default; 1 MW per 2 MWh module
    economics:
      # CAPEX: CNESA 2024 LFP benchmark ¥900-1000/kWh; BYD market pricing 2024
      capex_energy_per_kwh_yuan:       950.0  # ¥/kWh — ≈133 USD/kWh; BYD economy-of-scale pricing 2024
      capex_power_per_kw_yuan:           0.0  # ¥/kW  — bundled into energy CAPEX
      opex_fixed_per_kwh_year_yuan:     18.0  # ¥/kWh·yr — ≈2.5 USD/kWh·yr
      opex_var_per_mwh_yuan:             0.0  # ¥/MWh
      lifetime_years:                   15.0  # yr    — BYD warranty: 15 yr at ≥70% SOH
      cycle_life_full_equiv:          8000.0  # cycles — BYD LFP blade battery public spec (8000 at 90% DoD)
      eol_soh_threshold:                 0.80 # —     — 80% remaining capacity triggers replacement
      replacement_cost_fraction:         0.65 # —     — cell+BMS module replacement; learning-curve pricing
      residual_value_fraction:           0.05 # —
      construction_months:               6.0  # months
      decommissioning_cost_per_kwh_yuan: 25.0 # ¥/kWh

  sungrow-lfp-lc:
    # Sungrow PowerTitan ST2752UX — LFP liquid-cooled 5 MWh container system
    type: battery
    provenance: "public; Sungrow PowerTitan ST2752UX product datasheet (2024); Sungrow investor presentations 2024 (public); CNESA China Energy Storage Market Report 2024"
    physics:
      eta_ch:               0.970  # —   — charge efficiency; Sungrow PowerTitan round-trip ~94.1%;
                                    #       split 0.970×0.970=0.941 (non-overridable)
      eta_dis:              0.970  # —   — discharge efficiency (non-overridable)
      soc_min:              0.05   # —   — min SOC; Sungrow ST2752UX 95% usable DoD (5-100%)
                                    #       (non-overridable)
      soc_max:              0.95   # —   — max SOC (non-overridable)
      capacity_mwh_per_unit: 5.0   # MWh — ST2752UX 40ft container: 5.0 MWh (Sungrow public spec)
      power_mw_per_unit:     2.5   # MW  — 0.5C rate; 2.5 MW per 5 MWh module
    economics:
      capex_energy_per_kwh_yuan:       920.0  # ¥/kWh — ≈128 USD/kWh; Sungrow PowerTitan 2024 pricing
      capex_power_per_kw_yuan:           0.0  # ¥/kW  — bundled
      opex_fixed_per_kwh_year_yuan:     17.0  # ¥/kWh·yr — liquid cooling reduces cooling O&M vs air-cooled
      opex_var_per_mwh_yuan:             0.0  # ¥/MWh
      lifetime_years:                   15.0  # yr    — Sungrow 15-year warranty basis
      cycle_life_full_equiv:          8000.0  # cycles — Sungrow public spec; liquid cooling enables higher cycle count
      eol_soh_threshold:                 0.80 # —
      replacement_cost_fraction:         0.60 # —
      residual_value_fraction:           0.05 # —
      construction_months:               6.0  # months
      decommissioning_cost_per_kwh_yuan: 22.0 # ¥/kWh

