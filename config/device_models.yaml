  # ============================================================
  #  BENCHMARK LIBRARY — v2.1.0 additions (task #4)
  #  All values: public China 2024/25 market benchmarks.
  #  Sources cited in provenance field and contract §3–§4.
  # ============================================================

  # --------------------------------------------------------
  #  WIND TURBINES — China onshore 2024 benchmark models
  # --------------------------------------------------------

  goldwind-gw165-6.0:
    # Goldwind GW165-6.0 — 6.0 MW onshore; ~25% China market share 2023; 165m rotor
    type: wind_turbine
    provenance: "public; Goldwind Science & Technology 2024 product datasheet GW165-6.0; CNREC China Wind Energy Development Report 2023; IRENA Renewable Power Generation Costs 2023; Wood Mackenzie China Wind Market Report 2024 public summary"
    physics:
      v_cutin_mps:       3.0    # m/s  — cut-in speed (non-overridable)
      v_rated_mps:      10.5    # m/s  — rated speed; Goldwind GW165-6.0 public spec (IEC Class II)
      v_cutout_mps:     22.0    # m/s  — cut-out speed; Goldwind GW165-6.0 public spec
      hub_height_m:    120.0    # m    — typical for GW165 in moderate-wind inland sites; site-overridable
      rated_mw_per_unit: 6.0    # MW   — nameplate per turbine
    economics:
      # CAPEX: IRENA 2023 China onshore wind 6MW class ≈ $670 USD/kW → ~¥4800/kW
      # (CNREC 2023 installed cost range: ¥4500-5200/kW for 5-6MW class; CNY/USD ≈ 7.2)
      capex_per_kw_yuan:              4800.0  # ¥/kW — economy-of-scale advantage vs smaller turbines
      opex_fixed_per_kw_year_yuan:     150.0  # ¥/kW·yr — ≈21 USD/kW·yr; CNREC 2024 O&M benchmark (6MW class)
      opex_var_per_mwh_yuan:             0.0  # ¥/MWh — captured in fixed O&M
      lifetime_years:                   25.0  # yr    — IEC Class II/III 25-year design life
      replacement_cost_fraction:         0.12 # —     — major overhaul (blades, gearbox); lower than smaller turbines
      residual_value_fraction:           0.05 # —     — scrap steel value
      construction_months:              18.0  # months
      decommissioning_cost_per_kw_yuan:  90.0 # ¥/kW

  envision-en136-3.6:
    # Envision Energy EN136-3.6 — 3.6 MW onshore; ~12% China market share 2023; 136m rotor
    type: wind_turbine
    provenance: "public; Envision Energy 2024 product brochure EN136-3.6; IRENA Renewable Power Generation Costs 2023; CNREC China Wind Energy Development Report 2023"
    physics:
      v_cutin_mps:       3.0    # m/s  — cut-in speed (non-overridable)
      v_rated_mps:      11.0    # m/s  — rated speed; Envision EN136-3.6 public spec
      v_cutout_mps:     20.0    # m/s  — cut-out speed; Envision EN136-3.6 public spec
      hub_height_m:     90.0    # m    — typical for EN136 in Class II sites; site-overridable
      rated_mw_per_unit: 3.6    # MW   — nameplate per turbine
    economics:
      # CAPEX: IRENA 2023 China onshore 3-4MW class ≈ $725 USD/kW → ~¥5200/kW
      capex_per_kw_yuan:              5200.0  # ¥/kW — mid-tier 3.6 MW; IRENA 2023 midpoint
      opex_fixed_per_kw_year_yuan:     170.0  # ¥/kW·yr — ≈24 USD/kW·yr; slightly higher per-kW than 6MW class
      opex_var_per_mwh_yuan:             0.0  # ¥/MWh
      lifetime_years:                   25.0  # yr
      replacement_cost_fraction:         0.15 # —
      residual_value_fraction:           0.05 # —
      construction_months:              15.0  # months — smaller unit allows faster installation
      decommissioning_cost_per_kw_yuan:  95.0 # ¥/kW

  windey-wd156-3.0:
    # Windey (Sichuan Tianyi) WD156-3.0 — 3.0 MW onshore; economy class; used as cost floor
    type: wind_turbine
    provenance: "public; Windey (Sichuan Tianyi Renewable Energy) WD156-3.0 product specs (public); IRENA Renewable Power Generation Costs 2023 lower-bound estimate"
    physics:
      v_cutin_mps:       3.0    # m/s  — cut-in speed (non-overridable)
      v_rated_mps:      11.5    # m/s  — rated speed; Windey WD156 public spec
      v_cutout_mps:     20.0    # m/s  — cut-out speed; Windey WD156 public spec
      hub_height_m:     80.0    # m    — typical for 3.0 MW class; site-overridable
      rated_mw_per_unit: 3.0    # MW   — nameplate per turbine
    economics:
      # CAPEX: IRENA 2023 lower bound for 3MW class China; budget-tier domestic OEM
      capex_per_kw_yuan:              5400.0  # ¥/kW — ≈750 USD/kW; budget-tier 3 MW (higher per-kW than larger turbines)
      opex_fixed_per_kw_year_yuan:     160.0  # ¥/kW·yr — ≈22 USD/kW·yr
      opex_var_per_mwh_yuan:             0.0  # ¥/MWh
      lifetime_years:                   20.0  # yr    — shorter design life for economy-class turbines
      replacement_cost_fraction:         0.15 # —
      residual_value_fraction:           0.03 # —     — lower scrap value (economy components)
      construction_months:              12.0  # months
      decommissioning_cost_per_kw_yuan:  80.0 # ¥/kW

