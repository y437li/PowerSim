      capex_lump_sum_yuan:        15000000.0  # ¥ — ≈$2.1M; standard 220kV substation China; NEA guidelines
      opex_fixed_per_mw_year_yuan:    5000.0  # ¥/MW·yr — ≈700 USD/MW·yr; transmission service fee
