    economics: {}

  # ============================================================
  #  H₂ SCENARIO — GATED, INERT REFERENCE DATA (LINEAGE D35)
  #  rl-architect ruling (D35): electrolyzer entries land as INERT reference
  #  data while the H₂ scenario remains gated — direct analog of D23 (3D assets
  #  cleared before env-side gate).  Schema minor bump: "2.0.0" → "2.1.0"
  #  (additive; no re-LOCK; rl-architect authority).
  #
  #  INERT contract (mirrors economics: "ignored" pattern):
  #    - Resolver ignores `electrolyzer` type entries entirely — no EnvParams
  #      change, no H₂ dispatch logic added.
  #    - Site configs MUST NOT reference these IDs in assets: blocks until the
  #      H₂ scenario gate lifts (contracts/env/electrolyzer.md lands).
  #    - Activation path: contracts/env/electrolyzer.md → resolver extension
  #      → site YAML → agent action space expansion.
  #
  #  Physics fields: §8.2-verbatim (6 non-overridable fields).
  #  warmup_minutes: provisional — mentioned in §8.2 prose but not in the
  #    formal parameter table; resolver/env ignore at Δt=1h (D35 guardrail 1).
  #  Public data only (CLAUDE.md D32).
  # ============================================================

  # ---- Alkaline (ALK) electrolyzer — 20 MW class ----
  electrolyzer-alk-20mw:
    # Lowest CAPEX, best maturity, limited turndown (20% P_max min).
    # Reference manufacturers: PERIC HG-Alk; Longi H₂; Suzhou Jingli (China domestic).
    type: electrolyzer
    provenance: "public; PERIC HG-Alk series product literature (public 2024); Longi H2 public data; IRENA Green Hydrogen Cost Reduction 2020; IEA Global Hydrogen Review 2023; CNREC China Hydrogen Development Report 2023"
    physics:
      # §8.2-verbatim non-overridable fields:
      min_load_fraction:         0.20  # —       — ALK turndown limit: 20–100% P_max (§8.2 table: 20–100)
      standby_fraction:          0.02  # —       — standby draw: 2% P_max (§8.2 table: 2%)
      e_spec_kwh_per_kg:        52.0   # kWh/kg  — system-level specific energy (§8.2 table: 52)
      degradation_yuan_per_mwh:  4.0   # ¥/MWh   — degradation per MWh throughput (§8.2 table: 4)
      rated_mw_per_unit:        20.0   # MW      — nameplate P_max (§8.2 reference: "P_max_ely 20 MW")
      # provisional (§8.2 prose only; env ignores at Δt=1h — D35 guardrail 1):
      warmup_minutes:           30.0   # min     — cold-start: ALK typical 30–60 min
    economics:
      capex_per_kw_yuan:              3500.0  # ¥/kW — ≈490 USD/kW; China domestic ALK ¥2500–4000/kW 2024; IRENA 2023 mid-case
      opex_fixed_per_kw_year_yuan:      90.0  # ¥/kW·yr — ~2.5% of CAPEX; IEA benchmark
      opex_var_per_mwh_yuan:             0.0  # ¥/MWh
      stack_life_years:                  8.0  # yr  — ALK stack 80,000–100,000 hrs; IEA 2023
      replacement_cost_fraction:         0.30 # —   — stack replacement ~30% CAPEX; IEA/IRENA
      lifetime_years:                   20.0  # yr  — system design life; IEA 2023
      residual_value_fraction:           0.05 # —
      construction_months:              12.0  # months

  # ---- PEM electrolyzer — 10 MW class ----
  electrolyzer-pem-10mw:
    # Fastest response, best turndown (5% P_max); higher CAPEX; stack ~5 yr.
    # Reference manufacturers: Siemens Silyzer 300; Nel H₂; ITM Power.
    type: electrolyzer
    provenance: "public; Siemens Energy Silyzer 300 product data (public 2024); Nel Hydrogen public data; ITM Power public data; IRENA Green Hydrogen Cost Reduction 2020; IEA Global Hydrogen Review 2023"
    physics:
      # §8.2-verbatim non-overridable fields:
      min_load_fraction:         0.05  # —       — PEM turndown: 5–100% P_max (§8.2 table: 5–100)
      standby_fraction:          0.01  # —       — standby draw: 1% P_max (§8.2 table: 1%)
      e_spec_kwh_per_kg:        55.0   # kWh/kg  — system-level specific energy (§8.2 table: 55)
      degradation_yuan_per_mwh:  8.0   # ¥/MWh   — higher than ALK (§8.2 table: 8)
      rated_mw_per_unit:        10.0   # MW      — nameplate P_max
      # provisional (§8.2 prose only; env ignores at Δt=1h — D35 guardrail 1):
      warmup_minutes:            5.0   # min     — PEM fast warm-up: ~5 min from cold
    economics:
      capex_per_kw_yuan:              6500.0  # ¥/kW — ≈910 USD/kW; China domestic PEM ¥5000–8000/kW 2024; IRENA 2023
      opex_fixed_per_kw_year_yuan:     130.0  # ¥/kW·yr — ~2% of CAPEX; IEA benchmark
      opex_var_per_mwh_yuan:             0.0  # ¥/MWh
      stack_life_years:                  5.0  # yr  — PEM membrane: 60,000–80,000 hrs; IEA 2023
      replacement_cost_fraction:         0.40 # —   — PEM membrane/catalyst stack ~40% CAPEX
      lifetime_years:                   15.0  # yr  — system life (with stack replacements); IEA 2023
      residual_value_fraction:           0.05 # —
      construction_months:               9.0  # months

  # ---- AEM electrolyzer — 1 MW class (emerging technology) ----
  electrolyzer-aem-1mw:
    # Combines PEM turndown with ALK-like materials; limited commercial scale 2024.
    # Reference manufacturer: Enapter EL 4.0 (2.4 MW modular unit).
    type: electrolyzer
    provenance: "public; Enapter EL 4.0 product datasheet (public 2024); IEA Global Hydrogen Review 2023 AEM projections; IRENA Green Hydrogen Cost Reduction 2020"
    physics:
      # §8.2-verbatim non-overridable fields:
      min_load_fraction:         0.05  # —       — AEM turndown: 5–100% (analogous to PEM; emerging tech)
      standby_fraction:          0.01  # —       — standby draw: 1% P_max
      e_spec_kwh_per_kg:        53.0   # kWh/kg  — between ALK and PEM; AEM 2024 commercial level
      degradation_yuan_per_mwh: 10.0   # ¥/MWh   — higher than PEM due to membrane immaturity
      rated_mw_per_unit:         2.4   # MW      — Enapter EL 4.0 nominal rating (public spec)
      # provisional (§8.2 prose only; env ignores at Δt=1h — D35 guardrail 1):
      warmup_minutes:            5.0   # min     — AEM: fast warm-up, similar to PEM
    economics:
      capex_per_kw_yuan:              8500.0  # ¥/kW — ≈1190 USD/kW; Enapter EL 4.0 commercial pricing 2024 (public)
      opex_fixed_per_kw_year_yuan:     200.0  # ¥/kW·yr — higher O&M for emerging technology
      opex_var_per_mwh_yuan:             0.0  # ¥/MWh
      stack_life_years:                  3.0  # yr  — AEM membrane: ~30,000–40,000 hrs; IEA 2023
      replacement_cost_fraction:         0.50 # —
      lifetime_years:                   10.0  # yr  — shorter system life; membrane degradation rate
      residual_value_fraction:           0.03 # —
      construction_months:               6.0  # months

  # ---- SOEC electrolyzer — 5 MW class (high-temperature; baseload H₂) ----
  electrolyzer-soec-5mw:
    # Highest system efficiency (uses heat input); highest CAPEX; long cold-start.
    # Best for baseload H₂; most sensitive to thermal cycling.
    # Reference manufacturers: Sunfire Refuel; Bloom Energy.
    type: electrolyzer
    provenance: "public; Sunfire Refuel product literature (public 2024); Bloom Energy electrolyzer public data; IEA Global Hydrogen Review 2023; IRENA Green Hydrogen Cost Reduction 2020"
    physics:
      # §8.2-verbatim non-overridable fields:
      min_load_fraction:         0.20  # —       — SOEC limited turndown; thermal stability requires ≥20% P_max
      standby_fraction:          0.05  # —       — high standby: thermal maintenance at ~800°C (5% P_max)
      e_spec_kwh_per_kg:        40.0   # kWh/kg  — lowest electrical e_spec (uses heat input; IEA 2023)
      degradation_yuan_per_mwh: 15.0   # ¥/MWh   — highest (ceramic cells; IEA 2023)
      rated_mw_per_unit:         5.0   # MW      — Sunfire Refuel module rating (public)
      # provisional (§8.2 prose only; env ignores at Δt=1h — D35 guardrail 1):
      warmup_minutes:          240.0   # min     — SOEC cold-start: ~4h (high-temperature ceramics)
    economics:
      capex_per_kw_yuan:             14000.0  # ¥/kW — ≈1960 USD/kW; SOEC premium 2024; Sunfire public; IEA 2023
      opex_fixed_per_kw_year_yuan:     350.0  # ¥/kW·yr — ~2.5% of CAPEX; complex thermal management
      opex_var_per_mwh_yuan:             0.0  # ¥/MWh
      stack_life_years:                  2.0  # yr  — SOEC cells: 15,000–20,000 hrs; IEA 2023
      replacement_cost_fraction:         0.60 # —   — ceramic stack most expensive; IEA/Sunfire
      lifetime_years:                   10.0  # yr  — system design life
      residual_value_fraction:           0.03 # —
      construction_months:              18.0  # months — complex heat integration; longest construction
