    provenance: "public; device_model_schema.md v2.0.0 §6 initial estimates; IRENA Renewable Power Generation Costs 2023; CNESA 2024 energy storage market report; CATL LMP product data (public)"
    physics:
      eta_ch:               0.97    # —   — charge efficiency  (§3.3, non-overridable, LOCKED; D4)
      eta_dis:              0.97    # —   — discharge efficiency (non-overridable, LOCKED; D4)
      soc_min:              0.2     # —   — min SOC fraction (D4 binding, non-overridable, LOCKED)
      soc_max:              0.9     # —   — max SOC fraction (D4 binding, non-overridable, LOCKED)
      capacity_mwh_per_unit: 300.0  # MWh — nameplate energy per unit
      power_mw_per_unit:    100.0   # MW  — nameplate charge/discharge power per unit
    economics:
