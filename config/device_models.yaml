schema_version: "2.1.0"
# Device model library — physics constants keyed by LOCKED registry.json IDs (D23).
#
# Contract: contracts/shared/device_model_schema.md v2.0.0 (LOCKED)
#           contracts/shared/benchmark_device_library.md v1.0.0 (task #4)
#
# Schema version history:
#   "2.0.0" — price_table (24,)→(12,24) seasonal reshape (PR #87)
#   "2.1.0" — multi-brand China benchmark library: wind/PV/BESS/grid/electrolyzer (task #4)
#
# Non-overridable constants (device_model_schema.md §3.1):
#   wind_turbine:  v_cutin_mps, v_rated_mps, v_cutout_mps
#   pv_panel:      k_T_per_c, eta_inverter
#   battery:       eta_ch, eta_dis, soc_min, soc_max
#   electrolyzer:  ALL physics fields (min_load_fraction, standby_fraction,
#                  e_spec_kwh_per_kg, degradation_yuan_per_mwh, rated_mw_per_unit,
#                  warmup_minutes)
# Site-overridable and fleet params come from config/site_<name>.yaml.
# economics: consumed by Workstreams C/D (finance); resolver ignores all economics fields.
# provenance: public source citations; resolver ignores; required for PUBLIC REPO compliance.
#
# PUBLIC REPO (CLAUDE.md, D32): all committed values use public sources only.
# Proprietary/partner-confidential data lives in the gitignored private overlay only
# (ENERGY_GO_PRIVATE_CONFIG env var). Stubs carry provenance: "USER-provided, pending".

models:

