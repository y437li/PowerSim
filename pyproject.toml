[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-go"
version = "0.1.0"
description = "JAX-based RL environment for wind+solar+battery dispatch optimisation (Energy GO rebuild)"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.25",
    "jaxlib>=0.4.25",
]

[project.optional-dependencies]
# JAX accelerator variants — scripts select the right group at install time.
# jax[cpu] / jax[cuda12] install BOTH the jax core package AND the matching
# jaxlib wheel in one extra, so `import jax` works (not just jaxlib).
jax-cpu = [
    "jax[cpu]>=0.4.25",
]
# CUDA 12 wheel for Windows/Linux GPU boxes.
jax-gpu-cuda = [
    "jax[cuda12]>=0.4.25",
]
# Apple Silicon Metal backend — jax core + jax-metal plugin.
jax-gpu-metal = [
    "jax>=0.4.25",
    "jax-metal>=0.0.5",
]
# Training-only deps — never pulled by the serving image (§9.2).
training = [
    "optax>=0.2",
    "flax>=0.8",
    "orbax-checkpoint>=0.5",
    "sbx>=0.14",
    "numpy>=1.26",
    "scipy>=1.12",
]
# Serving deps — no training packages (keeps the serving image minimal).
serving = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "onnxruntime>=1.17",
    "pyyaml>=6.0",
    "numpy>=1.26",
]
# frontend-dev: sentinel for the scripts — Node/npm is installed via
# Homebrew (macOS) or winget (Windows), not pip.
frontend-dev = []
# dev: full stack for contributors — training + serving + test tooling.
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "optax>=0.2",
    "flax>=0.8",
    "orbax-checkpoint>=0.5",
    "sbx>=0.14",
    "numpy>=1.26",
    "scipy>=1.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "onnxruntime>=1.17",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
markers = [
    "slow: marks tests as slow (full install + venv creation); deselect with -m 'not slow'",
]
