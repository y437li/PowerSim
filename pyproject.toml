[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-go"
version = "0.1.0"
description = "JAX-based RL environment for wind+solar+battery dispatch optimisation (Energy GO rebuild)"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.25",
    "jaxlib>=0.4.25",
    "jsonschema>=4.0",  # required by energy_go.telemetry.validate (Draft202012Validator)
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "websockets>=12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "httpx>=0.27",
    "pytest-xdist>=3.5",
    "jsonschema>=4.21",
    "starlette>=0.36",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"energy_go.telemetry" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
asyncio_mode = "auto"
